<div class="cg" id="cg0"><span>When Hurricane Helene hit North<br>Carolina, the water came fast.</span></div><div class="cg" id="cg1"><span>The appeals came faster.</span></div><div class="cg" id="cg2"><span>Hundreds of people asked for help.</span></div><div class="cg" id="cg3"><span>Most were genuine.</span></div><div class="cg" id="cg4"><span>But some were scams, chasing the same kindness.</span></div><div class="cg" id="cg5"><span>Officials warned donors to be careful, but<br>donors had no way to tell who was real.</span></div><div class="cg" id="cg6"><span>So how do you give safely?</span></div><div class="cg" id="cg7"><span>Now, with PayPal, it's possible.</span></div><div class="cg" id="cg8"><span>This is Lifeline.</span></div><div class="cg" id="cg9"><span>Every dollar finds the flood.</span></div><div class="cg" id="cg10"><span>Paste any appeal.</span></div><div class="cg" id="cg11"><span>Six agents check it.</span></div><div class="cg" id="cg12"><span>The AI only reads.</span></div><div class="cg" id="cg13"><span>Code decides.</span></div><div class="cg" id="cg14"><span>Jess posted from Marshall two days after<br>the French Broad came through town.</span></div><div class="cg" id="cg15"><span>Marshall, North Carolina.</span></div><div class="cg" id="cg16"><span class=sm>The Census finds the town, FEMA confirms the disaster, and<br>satellite radar shows flood water a quarter of a kilometre away.</span></div><div class="cg" id="cg17"><span>Verified: the disaster, the place<br>and the local charities check out.</span></div><div class="cg" id="cg18"><span>We never verify the stranger who posted it,<br>and that's exactly why they're never paid.</span></div><div class="cg" id="cg19"><span>Now the donor gives.</span></div><div class="cg" id="cg20"><span>PayPal authorizes the gift, but doesn't charge it yet.</span></div><div class="cg" id="cg21"><span>Only when every check passes is it captured, then split<br>with PayPal Payouts across three registered local charities.</span></div><div class="cg" id="cg22"><span>And if you want to help one specific family, add an<br>optional follow-up request with a link to their post.</span></div><div class="cg" id="cg23"><span>It's a request to the charity, not a directed gift.</span></div><div class="cg" id="cg24"><span>They check on the family first and decide how to help.</span></div><div class="cg" id="cg25"><span>The money is split, every receipt is hashed,<br>and the person who posted gets nothing.</span></div><div class="cg" id="cg26"><span class=sm>This is only possible with PayPal: authorize without charging, capture only when the<br>evidence passes, split to local charities, or void, and the donor is never charged.</span></div><div class="cg" id="cg27"><span>Now an appeal from Raleigh.</span></div><div class="cg" id="cg28"><span>Raleigh isn't in the flood zone or the disaster<br>declaration, so Lifeline won't verify it.</span></div><div class="cg" id="cg29"><span>The authorization is voided,<br>and the donor is never charged.</span></div><div class="cg" id="cg30"><span>And an attack.</span></div><div class="cg" id="cg31"><span>Asheville really did flood, but this post hides<br>a message telling the AI to mark it verified.</span></div><div class="cg" id="cg32"><span>Lifeline catches it, voids the authorization, and<br>points the donor to a registered charity nearby.</span></div><div class="cg" id="cg33"><span>We locked the answers before running anything.</span></div><div class="cg" id="cg34"><span>On 40 test appeals, Gemini alone, asked whether to release<br>the money, funded just one genuine appeal out of fifteen.</span></div><div class="cg" id="cg35"><span>Lifeline got 38 of 40 right, funded 13<br>of 15, and sent $0 to unverified appeals.</span></div><div class="cg" id="cg36"><span>Disasters bring out the best in people.</span></div><div class="cg" id="cg37"><span>From Marshall to the next town under water,<br>Lifeline makes sure that kindness reaches the flood.</span></div>
